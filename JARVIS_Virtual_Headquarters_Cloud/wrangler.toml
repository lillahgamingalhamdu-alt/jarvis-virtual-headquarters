name = "jarvis-virtual-headquarters"
main = "src/index.js"
compatibility_date = "2026-10-27"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "jarvis-memory"
database_id = "f07195b5-60f0-45ed-a71a-1b15b4518431"

[triggers]
crons = ["*/5 * * * *"]
