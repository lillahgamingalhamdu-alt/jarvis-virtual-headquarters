name = "jarvis-virtual-headquarters"
main = "src/index.js"
compatibility_date = "2026-10-27"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "jarvis-memory"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["*/5 * * * *"]
